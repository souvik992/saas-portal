name: Licensing package

on:
  pull_request:
    paths:
      - "packages/licensing/**"
      - ".github/workflows/licensing.yml"
  push:
    branches: [main]
    paths:
      - "packages/licensing/**"
      - ".github/workflows/licensing.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/licensing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run build
      - run: npm test
