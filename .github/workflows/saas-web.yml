name: Portal

# Every push and pull request: typecheck, test and build the customer portal. Every push to main also publishes the
# build as a GitHub Release (portal-build-<n>, asset portal-dist.tar.gz): DinePOS Cloud's update
# (fine-dine cloud/hub/deploy/portal.sh) fetches the newest one and serves it on the portal's address.
on:
  pull_request:
    paths:
      - "cloud/saas-web/**"
      - ".github/workflows/saas-web.yml"
  push:
    branches: [main]
    paths:
      - "cloud/saas-web/**"
      - ".github/workflows/saas-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/saas-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pack the build
        run: tar -czf ../../portal-dist.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: portal-dist
          path: portal-dist.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portal-dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "portal-build-${{ github.run_number }}" portal-dist.tar.gz --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Portal (build ${{ github.run_number }})" --notes "Customer portal from ${GITHUB_SHA::7}. DinePOS Cloud fetches it on its next update (dinepos-cloud-update)." --latest
