name: Build and deploy POSINEXT website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/posts/**"
      - ".github/workflows/site-pages.yml"
  schedule:
    # 09:00 Asia/Kolkata = 03:30 UTC. Also publishes CMS posts whose date has arrived.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install site dependencies
        run: python -m pip install --disable-pip-version-check pillow fonttools brotli
      - name: Build static website
        run: python site/src/build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
