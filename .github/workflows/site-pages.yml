name: Check POSINEXT website build

# posinext.com is built and served by the Caddy server (site/deploy.sh; its timer rebuilds within 10 minutes of a push
# to main). This workflow only checks that the site still builds, so a bad blog post or page change shows up as a
# failed check on GitHub instead of a stuck deploy on the server. It deploys nothing.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/posts/**"
      - ".github/workflows/site-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "content/posts/**"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image and font tools (a fresh checkout's file times can make the build redo images)
        run: python -m pip install --disable-pip-version-check pillow fonttools brotli
      - name: Build static website
        run: |
          python site/src/build.py | tee build.log
          test -f site/public/admin/index.html
          if grep -q "Skipping invalid CMS post" build.log; then echo "::error::A CMS post in content/posts is invalid"; exit 1; fi
